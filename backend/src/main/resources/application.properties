server.port=8090

spring.application.name=backend

# Az adatbázis adatait a gyökérben lévő .env fájlból olvassuk, nem égetjük be
spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# így nem marad nyitva a db kapcsolat a teljes HTTP kérés alatt
spring.jpa.open-in-view=false

# egységes hibaválaszok
spring.mvc.problemdetails.enabled=true

# FlyWay
# a sémát a flyway építi, Hibernate csak ellenőriz
spring.jpa.hibernate.ddl-auto=validate

# ideiglenes admin belépés
# A .env-ben felülírható
minelush.admin.username=${ADMIN_USERNAME:admin}
minelush.admin.password=${ADMIN_PASSWORD:admin}
